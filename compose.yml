services:
  lantranet:
    image: node:24
    working_dir: /app
    user: "node" #UID=1000
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 30s
      retries: 10
    environment:
      - PORT=80
    ports:
      - 80:80
    volumes:
      - ./:/app
    command:
      - "bash"
      - "-c"
      - "npm i --verbose \
        && npx prisma migrate deploy \
        && npm run dev"

  prisma-studio:
    image: node:24
    working_dir: /app
    user: "node" #UID=1000
    profiles: ["prisma-studio"]
    env_file: .env
    ports:
      - 5555:5555
    volumes:
      - ./:/app
    command: "npx prisma studio"

  # To run the playwright tests, run "docker compose run --rm playwright"
  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0
    user: "ubuntu" #UID=1000
    depends_on:
      lantranet:
        condition: service_healthy
    working_dir: /app
    profiles: ["playwright"]
    environment:
      - DISPLAY=:0
    volumes:
      - ./:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: "npx playwright"
    command: "test"
  
  playwright-report:
    extends: playwright
    ports:
      - 9323:9323
    entrypoint: "npx playwright"
    command: "show-report --host=0.0.0.0 --port=9323"
